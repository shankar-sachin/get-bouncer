name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part of Bouncer
      options:
        - Chat
        - Code
        - IDE
        - Rebound
        - Marketplace
        - Install and updates
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and where it gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
